<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neeraj Chauhan — Backend Engineer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FAFAFA;
    font-family: Inter, -apple-system, sans-serif;
    color: #1A1A1A;
    padding: 2rem 1rem;
  }
  .card {
    max-width: 560px;
    width: 100%;
  }
  h1 {
    font-size: clamp(1.75rem, 5vw, 2.5rem);
    font-weight: 700;
    margin-bottom: 0.25rem;
  }
  .tagline {
    font-size: 1.05rem;
    color: #444;
    margin-bottom: 1.75rem;
    line-height: 1.5;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  .links a {
    text-decoration: none;
    color: #1A1A1A;
    border: 1px solid #1A1A1A;
    padding: 0.55rem 1.1rem;
    border-radius: 4px;
    font-size: 0.95rem;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .links a:hover {
    background: #2563EB;
    border-color: #2563EB;
    color: #fff;
  }
  .contact {
    margin-top: 1.5rem;
    font-size: 0.9rem;
    color: #666;
  }
  span.accent { color: #2563EB; }

  form {
    margin-top: 2.5rem;
    padding-top: 2rem;
    border-top: 1px solid #E0E0E0;
  }
  form h2 {
    font-size: 1.1rem;
    margin-bottom: 1rem;
  }
  form label {
    display: block;
    font-size: 0.85rem;
    color: #444;
    margin-bottom: 0.3rem;
  }
  form input, form textarea {
    width: 100%;
    padding: 0.6rem 0.75rem;
    margin-bottom: 1rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.95rem;
  }
  form textarea { min-height: 100px; resize: vertical; }
  form button {
    background: #2563EB;
    color: #fff;
    border: none;
    padding: 0.65rem 1.4rem;
    border-radius: 4px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  form button:hover { background: #1d4ed8; }
  #form-status {
    margin-top: 0.75rem;
    font-size: 0.9rem;
  }
  #form-status.success { color: #16a34a; }
  #form-status.error { color: #dc2626; }
</style>
</head>
<body>
  <div class="card">
    <h1>Neeraj Chauhan</h1>
    <p class="tagline">
      I build backend systems <span class="accent">that survive real load</span> —
      APIs, databases, Docker, and auth, shipped with real tests, not just demos.
      Case studies and project write-ups coming soon.
    </p>
    <div class="links">
      <a href="https://github.com/neeraj-ch7" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/neeraj-ch7" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://drive.google.com/file/d/1SN_UiP3dWTNfx0XToZAU_Ew4RLa68OGl/view?usp=sharing" target="_blank" rel="noopener">Resume</a>
      <a href="tel:+917704870486">Call me</a>
    </div>
    <p class="contact">+91-7704870486</p>

    <form id="contact-form">
      <h2>Get in touch</h2>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />

      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">Send</button>
      <p id="form-status"></p>
    </form>
  </div>

  <script>
    const form = document.getElementById("contact-form");
    const status = document.getElementById("form-status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      status.textContent = "Sending...";
      status.className = "";

      const data = new FormData(form);
      try {
        const res = await fetch("https://formspree.io/f/xljewzye", {
          method: "POST",
          body: data,
          headers: { Accept: "application/json" },
        });

        if (res.ok) {
          status.textContent = "Thanks — your message has been sent.";
          status.className = "success";
          form.reset();
        } else {
          status.textContent = "Something went wrong. Please try again.";
          status.className = "error";
        }
      } catch (err) {
        status.textContent = "Network error. Please try again.";
        status.className = "error";
      }
    });
  </script>
</body>
</html>
